# Third-party actions are pinned to commit SHAs (supply chain hardening). To bump one:
#   git ls-remote https://github.com/<owner>/<action> refs/tags/<tag>
# then update the SHA and the version comment on every 'uses:' line in .github/.
name: CI Pipeline Prestashop
on:
  push:
    branches:
      [ "main", "develop" ]
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: read
    name: Build environment
    runs-on: ubuntu-latest
    steps:
      - name: Clone Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 7.4
      - name: Create Cache Directories
        run: |
          mkdir -p ~/.build
      - name: Mount Build Cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          key: cache-plugin-${{ github.run_id }}
          path: ~/.build
      - name: Audit Composer dependencies
        working-directory: src
        run: composer audit --locked --no-dev --abandoned=report
      - name: Audit Composer dev dependencies (informational)
        working-directory: src
        continue-on-error: true
        run: composer audit --locked --abandoned=report
      - name: Verify Adyen Web SDK SRI hashes
        run: bash ./dist/scripts/verify_web_sdk_sri.sh
      - name: Build Plugin
        uses: ./.github/actions/build_plugin

  run:
    permissions:
      contents: read
    name: E2E | Prestashop ${{ matrix.prestashop }}, PHP ${{ matrix.php }}, Browser ${{matrix.browser }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - prestashop: '1.7.8.5-apache'
            php: '7.4'
            port: 80
            mysql: 5.7
            browser: 'chromium'
            device: 'Desktop Chrome'
          - prestashop: '8.1.2-apache'
            php: '7.4'
            port: 80
            mysql: 5.7
            browser: 'firefox'
            device: 'Desktop Firefox'
    steps:
      - name: Clone Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: main

      - name: Mount Build Cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          key: cache-plugin-${{ github.run_id }}
          path: ~/.build

## comment
      - name: E2E Tests, Prestashop ${{ matrix.shopware }}
        uses: ./main/.github/actions/run_e2e
        with:
          PRESTASHOP: ${{ matrix.prestashop }}
          PHP: ${{ matrix.php }}
          NODE: 20
          PORT: ${{ matrix.port }}
          NGROK: ${{ secrets.NGROK }}
          GH_PAT: ${{ secrets.GH_PAT }}
          API_KEY_TEST: ${{ secrets.API_KEY_TEST }}
          API_KEY_LIVE: ${{ secrets.API_KEY_LIVE }}
          MERCHANT_ACCOUNT_TEST: ${{ secrets.MERCHANT_ACCOUNT_TEST }}
          MERCHANT_ACCOUNT_LIVE: ${{ secrets.MERCHANT_ACCOUNT_LIVE }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          PRESTASHOP_TEST_REPO: ${{secrets.PRESTASHOP_TEST_REPO}}
          COMMON_TEST_REPO: ${{secrets.COMMON_TEST_REPO}}
          MYSQL: ${{matrix.mysql}}
          PAY_PAL_EMAIL: ${{secrets.PAY_PAL_EMAIL}}
          PAY_PAL_PASSWORD: ${{secrets.PAY_PAL_PASSWORD}}
          BROWSER: ${{ matrix.browser }}
          DEVICE: ${{ matrix.device }}
